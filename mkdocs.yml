site_name: 柴郡の笺月屿
site_description: 记录、写作与分享
site_author: Cheshire-qwq
# ↓↓↓ 上线前把这两行改成你自己的 ↓↓↓
site_url: https://Cheshire-qwq.github.io/mysite/

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: '#8799B0'
      accent: '#6A7FA0'
      toggle:
        icon: material/weather-night
        name: 切换到夜间模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: '#8799B0'
      accent: '#6A7FA0'
      toggle:
        icon: material/weather-sunny
        name: 切换到日间模式
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

nav:
  - 首页: index.md
  - 文章集: blog/index.md
  - 短打素材库: blog/thingking.md
  - 其他: about.md

plugins:
  - search:
      lang:
        - zh
        - en
  - blog:
      blog_dir: blog
      post_date_format: full
      archive: true
      categories: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: 保留所有权利

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/site.js
